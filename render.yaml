services:
  - type: web
    name: property25-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://midpointblue.co.za,http://localhost:5173,http://127.0.0.1:5173
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
